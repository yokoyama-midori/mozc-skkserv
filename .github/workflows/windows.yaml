name: Build mozc_skkserv (Windows)
# Based on https://github.com/google/mozc/blob/master/.github/workflows/windows.yaml

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    name: build_on_${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Check that the tag is the version of the source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $source = Get-Content overlay\mozc_inproc\mozc_skkserv.cc -Raw
          if ($source -notmatch 'kVersion\[\] = "mozc-skkserv/([^"]+)"') { throw 'kVersion was not found.' }
          if ("v$($Matches[1])" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME is not the version $($Matches[1]) of the source."
          }

      - name: Try to restore update_deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: mozc/src/third_party_cache
          key: update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mozc/src/build_tools/update_deps.py') }}

      - name: Install Dependencies (LLVM, MSYS2, Ninja; no Qt)
        shell: cmd
        working-directory: .\mozc\src
        run: |
          python build_tools/update_deps.py --noqt --nowix

      - name: Build
        shell: pwsh
        run: |
          .\scripts\build.ps1
          .\scripts\build.ps1 -Targets euc_jp_check -OutDir tmp\check

      - name: Test
        shell: pwsh
        run: |
          python tests/test_euc_jp.py tmp\check\euc_jp_check.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_server.py dist\mozc_skkserv.exe

      - name: Upload mozc_skkserv
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mozc_skkserv-${{ matrix.arch }}
          path: dist
          if-no-files-found: error

  # A draft: it is published by hand on the page of the repository.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          path: artifacts

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd artifacts
          for dir in mozc_skkserv-*; do
            name="mozc_skkserv-${version}-win-${dir#mozc_skkserv-}"
            mv "${dir}" "${name}"
            zip -r "${name}.zip" "${name}"
          done
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --draft --notes "" \
            --title "mozc-skkserv ${version}" \
            *.zip SHA256SUMS.txt
